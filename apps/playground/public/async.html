<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>异步语音 · 听见</title>
<link rel="stylesheet" href="/playground/siren.css" />
<style>
  .rec-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .rec-row .input-line { flex: 1 1 180px; }
  #asrOut { min-height: 72px; }
  .tts-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .tts-controls label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
  #ttsMeta { margin: 12px 0 4px; }
  audio#player { width: 100%; margin-top: 10px; }
  .rec-live { color: var(--danger); font-weight: 600; letter-spacing: .06em; }
  .check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--dim); cursor: pointer; }
  .check input { accent-color: var(--gold-line); }
</style>
</head>
<body>
  <div class="wrap" style="max-width:720px">
    <header class="masthead">
      <h1>异步语音</h1>
      <span class="crumb"><a href="/">听见</a> · <a href="/realtime">实时通话</a> · 语音</span>
    </header>
    <p class="sub">说完再转写 · 写完再出声</p>

    <section class="card">
      <h2>录音 → 转写</h2>
      <div class="rec-row">
        <button class="btn" id="startRec">开始录音</button>
        <button class="btn btn-danger" id="stopRec" disabled>停止并转写</button>
        <span class="muted" id="recTime"></span>
      </div>
      <div class="rec-row">
        <input class="input-line" id="asrConv" placeholder="conversation_id（可选）" />
        <label class="check"><input type="checkbox" id="asrStore" checked /> 存为语音资产</label>
      </div>
      <pre class="panel" id="asrOut" style="margin-top:12px">尚未转写。</pre>
    </section>

    <section class="card">
      <h2>文字 → 合成</h2>
      <textarea class="input-line" id="ttsText">我在。今天慢一点说，不着急。</textarea>
      <div class="tts-controls">
        <select class="input-box" id="emotion">
          <option>warm</option><option>neutral</option><option>happy</option><option>sad</option>
          <option>angry</option><option>teasing</option><option>sleepy</option><option>excited</option><option>surprised</option>
        </select>
        <label>语速 <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1" /> <span id="speedVal">1.0</span></label>
        <button class="btn" id="speakBtn">合成并播放</button>
      </div>
      <div class="muted" id="ttsMeta"></div>
      <audio id="player" controls></audio>
    </section>

    <script src="/playground/async-voice-test.js"></script>
  </div>
</body>
</html>
