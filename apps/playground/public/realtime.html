<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>实时通话 · 听见</title>
<link rel="stylesheet" href="/playground/siren.css" />
<style>
  /* 本页专属：通话控制区的细排 */
  .call-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .call-row .input-line { flex: 1 1 200px; }
  .vad-grid { display: flex; gap: 14px 22px; flex-wrap: wrap; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .vad-grid label { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--dim); }
  .vad-grid input { width: 64px; }
  #partial { min-height: 26px; font-style: italic; color: #b7c0d4; margin: 0 0 10px; }
  #reply { min-height: 26px; margin: 0; }
  .subhead { margin: 18px 0 10px !important; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <h1>实时通话</h1>
      <span class="crumb"><a href="/">听见</a> · <a href="/async">异步语音</a> · 通话</span>
    </header>
    <p class="sub">打电话给他 · 你说话他实时听，他说话你能抢话</p>

    <section class="card">
      <div class="call-row">
        <span class="badge" id="stateBadge" title="点一下强制打断">idle</span>
        <input class="input-line" id="conversationId" placeholder="conversation_id（可选，空则自动生成）" />
        <button class="btn" id="callBtn">呼叫</button>
        <button class="btn btn-ghost" id="muteBtn" disabled>静音</button>
        <button class="btn btn-danger" id="hangupBtn" disabled>挂断</button>
      </div>
      <div class="call-row" style="margin-top:12px">
        <label class="muted" style="display:inline-flex;align-items:center;gap:8px">
          模式
          <select class="input-box" id="mode">
            <option value="vad">VAD 自动断句</option>
            <option value="ptt">按住说话（PTT）</option>
          </select>
        </label>
        <button class="btn btn-ghost" id="pttBtn" style="display:none">🎤 按住说话</button>
        <span class="muted" id="noiseFloor">noise floor: −</span>
      </div>
      <div class="vad-grid">
        <span class="muted" style="letter-spacing:.08em">VAD 参数</span>
        <label>确认 <input class="input-box" id="vConfirm" type="number" value="200" />ms</label>
        <label>最短语音 <input class="input-box" id="vMin" type="number" value="400" />ms</label>
        <label>结束静音 <input class="input-box" id="vEnd" type="number" value="700" />ms</label>
        <label>RMS 倍数 <input class="input-box" id="vRatio" type="number" value="4" step="0.5" /></label>
        <label>抖动缓冲 <input class="input-box" id="vJitter" type="number" value="350" />ms</label>
      </div>
    </section>

    <div class="grid-2">
      <section class="card">
        <h2>他在听见的</h2>
        <p id="partial">（说话字幕会先出现在这里）</p>
        <pre class="panel" id="asrLog">最终识别文本会出现在这里</pre>
      </section>
      <section class="card">
        <h2>他在说的</h2>
        <p id="reply">（回复文本）</p>
        <h2 class="subhead">延迟指标</h2>
        <table class="metrics"><tbody id="metricsBody"><tr><td class="muted">等待第一轮…</td></tr></tbody></table>
      </section>
    </div>

    <section class="card">
      <h2>事件日志</h2>
      <pre class="panel" id="eventLog" style="max-height:180px"></pre>
    </section>

    <script src="/playground/realtime-call-test.js"></script>
  </div>
</body>
</html>
