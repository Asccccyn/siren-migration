<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>听见 · Siren</title>
<link rel="stylesheet" href="/playground/siren.css" />
<style>
  .nav-card {
    display: block; padding: 26px 28px; margin-bottom: 16px;
    background: var(--panel-soft); border: 1px solid var(--line); border-radius: var(--radius);
    backdrop-filter: blur(10px); cursor: pointer;
    transition: border-color .2s ease, background .2s ease, transform .25s cubic-bezier(.16,1,.3,1);
  }
  .nav-card:hover { border-color: var(--gold-line); background: #162139aa; transform: translateY(-2px); }
  .nav-card .t { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .nav-card h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 24px; letter-spacing: .1em; color: var(--ink); }
  .nav-card .arrow { color: var(--gold-line); font-size: 18px; transition: transform .2s ease; }
  .nav-card:hover .arrow { transform: translateX(4px); }
  .nav-card p { margin: 8px 0 0; color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
  <div class="wrap" style="max-width:640px">
    <header class="masthead">
      <h1>听见</h1>
      <span class="crumb">他的声音</span>
    </header>
    <p class="sub">三个入口 · 都从这里出发</p>

    <a class="nav-card" href="/">
      <div class="t"><h2>语音信箱</h2><span class="arrow">→</span></div>
      <p>他说过的话一条条排着，点开就听。</p>
    </a>

    <a class="nav-card" href="/realtime">
      <div class="t"><h2>实时通话</h2><span class="arrow">→</span></div>
      <p>打电话给他。你说话他实时听，他说话你能抢话。</p>
    </a>

    <a class="nav-card" href="/async">
      <div class="t"><h2>异步语音</h2><span class="arrow">→</span></div>
      <p>你录一段他来转写，或让他把一句话读给你听。</p>
    </a>

    <p class="muted" style="margin-top:28px">每个页面首次使用需要登录（输入你设置的密码）。<br>
    连接异常时看 <code style="background:#0b0e14;padding:2px 6px;border-radius:4px">/health</code>，凭证在服务端 .env。</p>
  </div>
</body>
</html>
